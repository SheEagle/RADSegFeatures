version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: talk2dino_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9201:9200"
    volumes:
      - talk2dino_es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: talk2dino_redis
    ports:
      - "6380:6379"
    volumes:
      - talk2dino_redis_data:/data

volumes:
  talk2dino_es_data:
    driver: local
  talk2dino_redis_data:
    driver: local
